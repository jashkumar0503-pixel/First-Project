<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BOOK READING ACTIVITY FOR PCE</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background: #f4f6f8;
    }

    .container {
        max-width: 1100px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    }

    h1 {
        text-align: center;
        font-size: 26px;
        margin-bottom: 25px;
    }

    .form-group {
        margin-bottom: 15px;
    }

    label {
        display: block;
        font-weight: bold;
        margin-bottom: 6px;
    }

    input,
    select {
        width: 100%;
        padding: 11px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 15px;
    }

    .batch-options {
        display: flex;
        gap: 25px;
        align-items: center;
    }

    .batch-options label {
        font-weight: normal;
        margin: 0;
    }

    .batch-options input {
        width: auto;
        margin-right: 5px;
    }

    button {
        padding: 10px 18px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 15px;
        margin-right: 8px;
        margin-top: 5px;
    }

    .save-btn {
        background: #198754;
        color: white;
    }

    .clear-btn {
        background: #6c757d;
        color: white;
    }

    .edit-btn {
        background: #ffc107;
        color: black;
    }

    .delete-btn {
        background: #dc3545;
        color: white;
    }

    .search {
        margin: 25px 0 15px;
    }

    .message {
        margin-top: 12px;
        font-weight: bold;
    }

    .table-container {
        overflow-x: auto;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
        min-width: 850px;
    }

    th,
    td {
        border: 1px solid #ddd;
        padding: 10px;
        text-align: left;
    }

    th {
        background: #343a40;
        color: white;
    }

    tr:nth-child(even) {
        background: #f8f9fa;
    }

    .empty {
        text-align: center;
        color: #777;
        padding: 20px;
    }

    @media (max-width: 600px) {
        body {
            padding: 10px;
        }

        .container {
            padding: 15px;
        }

        h1 {
            font-size: 20px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <h1>BOOK READING ACTIVITY FOR PCE (BE03000051)</h1>

    <form id="studentForm">

        <div class="form-group">
            <label for="studentName">Student Name</label>
            <input
                type="text"
                id="studentName"
                placeholder="Enter student name"
                required
            >
        </div>

        <div class="form-group">
            <label for="enrollment">Enrollment Number</label>
            <input
                type="text"
                id="enrollment"
                placeholder="Enter enrollment number"
                required
            >
        </div>

        <div class="form-group">
            <label>Student Batch</label>

            <div class="batch-options">
                <label>
                    <input type="radio" name="batch" value="A">
                    Batch A
                </label>

                <label>
                    <input type="radio" name="batch" value="B">
                    Batch B
                </label>
            </div>
        </div>

        <div class="form-group">
            <label for="bookName">Book Name</label>

            <select id="bookName" required>
                <option value="">-- Select Book --</option>

                <option>You Can Win — Shiv Khera</option>
                <option>How to Win Friends and Influence People — Dale Carnegie</option>
                <option>Getting Things Done: The Art of Stress Free Productivity — David Allen</option>
                <option>Quiet: The Power of Introvert in the World They Can't Stop Talking — Susan Cain</option>
                <option>The Alchemist — Paulo Coelho</option>
                <option>The 7 Habits of Highly Effective People — Stephen Covey</option>
                <option>What to Say When You Talk to Yourself — Dr. Shad Helmstetter</option>
                <option>The Big Leap — Gay Hendricks</option>
                <option>Thinking Fast and Slow — Daniel Kahneman</option>
                <option>The Art of Thinking Clearly — Ralf Dobelli</option>
                <option>Upside-Down King — Sudha Murthy</option>
                <option>Born to Be Happy — Pramod Batra</option>
                <option>Ikigai: The Japanese Secret to a Long and Happy Life — Héctor García & Francesc Miralles</option>
                <option>Poor Little Rich Slum — Rashmi Bansal</option>
                <option>Most and More — Mahatria Ra</option>
                <option>The Old Man and the Sea — Ernest Hemingway</option>
                <option>Rich Dad Poor Dad — Robert Kiyosaki</option>
                <option>The Monk Who Sold His Ferrari — Robin Sharma</option>
                <option>Who Moved My Cheese? — Dr. Spencer Johnson</option>
                <option>The Business of the 21st Century — Robert Kiyosaki</option>
                <option>My Experiments with Truth — Mahatma Gandhi</option>
                <option>Five Point Someone — Chetan Bhagat</option>
                <option>The Secret — Rhonda Byrne</option>
                <option>The Power of Positive Thinking — Norman Vincent Peale</option>
                <option>The Power of Your Subconscious Mind — Joseph Murphy</option>
                <option>The 5 AM Club — Robin Sharma</option>
                <option>Who Will Cry When You Die? — Robin Sharma</option>
                <option>Discover Your Destiny — Robin Sharma</option>
                <option>Wings of Fire — A.P.J. Abdul Kalam</option>
                <option>I Have a Dream — Rashmi Bansal</option>
                <option>The 5 Steps to Success — Yandamoori Veerendranath</option>
                <option>You Are Born to Blossom — A.P.J. Abdul Kalam</option>
                <option>Tiya: A Parrot's Journey Home — Samarpan</option>
                <option>The God of Small Things — Arundhati Roy</option>
                <option>How to Develop a 'Never Give Up' Attitude — Dr. Hardik Joshi</option>
                <option>Three Thousand Stitches: Ordinary People, Extraordinary Lives — Sudha Murthy</option>
                <option>Chanakya in Daily Life — Radhakrishnan Pillai</option>
                <option>Siddhartha — Hermann Hesse</option>
                <option>Kiss That Frog — Brian Tracy</option>
                <option>Eat That Frog!: 21 Great Ways to Stop Procrastinating and Get More Done in Less Time — Brian Tracy</option>
            </select>
        </div>

        <!-- NEW RESPONSE FIELD -->
        <div class="form-group">
            <label for="readingDate">Reading Date</label>

            <input
                type="date"
                id="readingDate"
                required
            >
        </div>

        <button type="submit" class="save-btn" id="saveButton">
            Add Student
        </button>

        <button
            type="button"
            class="clear-btn"
            onclick="clearForm()"
        >
            Clear
        </button>

    </form>

    <div id="message" class="message"></div>

    <div class="search">
        <label for="searchBox">Search Student</label>

        <input
            type="text"
            id="searchBox"
            placeholder="Search by name, enrollment, batch or book..."
            oninput="displayStudents()"
        >
    </div>

    <div class="table-container">

        <table>

            <thead>
                <tr>
                    <th>No.</th>
                    <th>Student Name</th>
                    <th>Enrollment Number</th>
                    <th>Batch</th>
                    <th>Book Name</th>
                    <th>Reading Date</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="studentTableBody"></tbody>

        </table>

    </div>

</div>

<script>

const STORAGE_KEY = "PCE_BOOK_DATA";

let students = JSON.parse(
    localStorage.getItem(STORAGE_KEY)
) || [];

let editingId = null;


/* SAVE DATA */
function saveData() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(students)
    );
}


/* SORT BY ENROLLMENT NUMBER */
function sortStudents() {

    students.sort(function(a, b) {

        const numA = parseInt(
            String(a.enrollment).replace(/\D/g, "")
        ) || 0;

        const numB = parseInt(
            String(b.enrollment).replace(/\D/g, "")
        ) || 0;

        return numA - numB;
    });
}


/* ADD / UPDATE STUDENT */
document.getElementById("studentForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    const name =
        document.getElementById("studentName")
        .value.trim();

    const enrollment =
        document.getElementById("enrollment")
        .value.trim();

    const batchElement =
        document.querySelector(
            'input[name="batch"]:checked'
        );

    const book =
        document.getElementById("bookName")
        .value;

    const readingDate =
        document.getElementById("readingDate")
        .value;


    if (!name || !enrollment || !batchElement || !book || !readingDate) {

        showMessage(
            "Please fill all fields.",
            "red"
        );

        return;
    }


    const batch = batchElement.value;


    /* CHECK DUPLICATE ENROLLMENT */
    const duplicate = students.find(function(student) {

        return (
            student.enrollment.toLowerCase() ===
            enrollment.toLowerCase()
            &&
            student.id !== editingId
        );

    });


    if (duplicate) {

        showMessage(
            "This enrollment number already exists.",
            "red"
        );

        return;
    }


    /* UPDATE EXISTING STUDENT */
    if (editingId !== null) {

        const student = students.find(
            s => s.id === editingId
        );

        if (student) {

            student.name = name;
            student.enrollment = enrollment;
            student.batch = batch;
            student.book = book;
            student.readingDate = readingDate;
        }

        showMessage(
            "Student details updated successfully.",
            "green"
        );

        editingId = null;

        document.getElementById("saveButton")
        .textContent = "Add Student";

    }

    /* ADD NEW STUDENT */
    else {

        students.push({

            id: Date.now(),

            name: name,

            enrollment: enrollment,

            batch: batch,

            book: book,

            readingDate: readingDate
        });

        showMessage(
            "Student added successfully.",
            "green"
        );
    }


    sortStudents();

    saveData();

    displayStudents();

    clearForm(false);

});


/* DISPLAY STUDENTS */
function displayStudents() {

    const tbody =
        document.getElementById("studentTableBody");

    const search =
        document.getElementById("searchBox")
        .value
        .toLowerCase()
        .trim();


    const filteredStudents =
        students.filter(function(student) {

            return (

                student.name.toLowerCase()
                .includes(search)

                ||

                student.enrollment.toLowerCase()
                .includes(search)

                ||

                student.batch.toLowerCase()
                .includes(search)

                ||

                student.book.toLowerCase()
                .includes(search)

                ||

                student.readingDate
                .toLowerCase()
                .includes(search)

            );

        });


    if (filteredStudents.length === 0) {

        tbody.innerHTML = `
            <tr>
                <td colspan="7" class="empty">
                    No student records found.
                </td>
            </tr>
        `;

        return;
    }


    tbody.innerHTML = "";


    filteredStudents.forEach(function(student, index) {

        const row = document.createElement("tr");

        row.innerHTML = `

            <td>${index + 1}</td>

            <td>${escapeHTML(student.name)}</td>

            <td>${escapeHTML(student.enrollment)}</td>

            <td>Batch ${escapeHTML(student.batch)}</td>

            <td>${escapeHTML(student.book)}</td>

            <td>${escapeHTML(student.readingDate)}</td>

            <td>

                <button
                    class="edit-btn"
                    onclick="editStudent(${student.id})"
                >
                    Edit
                </button>

                <button
                    class="delete-btn"
                    onclick="deleteStudent(${student.id})"
                >
                    Delete
                </button>

            </td>
        `;

        tbody.appendChild(row);

    });

}


/* EDIT STUDENT */
function editStudent(id) {

    const student =
        students.find(
            s => s.id === id
        );

    if (!student) return;


    document.getElementById("studentName")
    .value = student.name;


    document.getElementById("enrollment")
    .value = student.enrollment;


    const batchRadio =
        document.querySelector(
            `input[name="batch"][value="${student.batch}"]`
        );

    if (batchRadio) {
        batchRadio.checked = true;
    }


    document.getElementById("bookName")
    .value = student.book;


    document.getElementById("readingDate")
    .value = student.readingDate;


    editingId = id;


    document.getElementById("saveButton")
    .textContent = "Update Student";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });


    showMessage(
        "You are editing this student's details.",
        "blue"
    );
}


/* DELETE STUDENT */
function deleteStudent(id) {

    const student =
        students.find(
            s => s.id === id
        );

    if (!student) return;


    const confirmed =
        confirm(
            "Delete this student's record?"
        );


    if (!confirmed) return;


    students =
        students.filter(
            s => s.id !== id
        );


    saveData();

    displayStudents();


    showMessage(
        "Student deleted.",
        "green"
    );
}


/* CLEAR FORM */
function clearForm(showMsg = true) {

    document.getElementById("studentForm")
    .reset();

    editingId = null;


    document.getElementById("saveButton")
    .textContent = "Add Student";


    if (showMsg) {

        showMessage(
            "Form cleared.",
            "blue"
        );
    }
}


/* MESSAGE */
function showMessage(text, color) {

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.style.color = color;


    setTimeout(function() {

        message.textContent = "";

    }, 3000);
}


/* SECURITY: ESCAPE HTML */
function escapeHTML(value) {

    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");
}


/* INITIAL DISPLAY */
sortStudents();

displayStudents();

</script>

</body>
</html>
