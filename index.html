}
</style>
</head>

<!-- BUTTONS -->

    <button

    >

    <button

        id="cancelButton"
        onclick="cancelEdit()"
        style="display:none;"
    >
        Cancel
    </button>

<!-- SUCCESS MESSAGE -->

    id="message"
    class="message"
></div>


<!-- SEARCH -->

    class="search"
    type="text"
    id="search"
    placeholder="Search student..."
    oninput="showStudents()"
>

    <b id="count">
        Total Students: 0
    </b>
</div>


<!-- TABLE -->

<div class="table-box">

<table>

<thead>
<tr>
    <th>No.</th>
    <th>Student Name</th>
    <th>Enrollment Number</th>
    <th>Batch</th>
    <th>Book Name</th>
    <th>Action</th>
</tr>
</thead>

<tbody id="studentTable"></tbody>

</table>

<script>

/* =====================================
   DATA
===================================== */

let students =
    JSON.parse(
        localStorage.getItem("PCE_BOOK_DATA")
    ) || [];

let editingId = null;


/* =====================================
   SAVE DATA
===================================== */

function saveData() {

    localStorage.setItem(
        "PCE_BOOK_DATA",
        JSON.stringify(students)
    );

}


/* =====================================
   ADD / UPDATE STUDENT
===================================== */

function saveStudent() {

    const name =
        document.getElementById("name")
        .value
        .trim();

    const enrollment =
        document.getElementById("enrollment")
        .value
        .trim();

    const book =
        document.getElementById("book")
        .value;

    const batchElement =
        document.querySelector(
            'input[name="batch"]:checked'
        );

    const batch =
        batchElement
        ? batchElement.value
        : "";


    /* CHECK INPUT */

    if (!name) {
        alert("Please enter student name.");
        return;
    }

    if (!enrollment) {
        alert("Please enter enrollment number.");
        return;
    }

    if (!batch) {
        alert("Please select Batch A or B.");
        return;
    }

    if (!book) {
        alert("Please select a book.");
        return;
    }


    /* CHECK DUPLICATE */

    const duplicate =
        students.find(function(student) {

            return (
                student.enrollment === enrollment &&
                student.id !== editingId
            );

        });


    if (duplicate) {

        alert(
            "This enrollment number already exists."
        );

        return;
    }


    /* UPDATE */

    if (editingId !== null) {

        const student =
            students.find(
                s => s.id === editingId
            );

        if (student) {

            student.name = name;
            student.enrollment = enrollment;
            student.batch = batch;
            student.book = book;

        }

        editingId = null;

        document.getElementById(
            "saveButton"
        ).textContent = "Add Student";

        document.getElementById(
            "cancelButton"
        ).style.display = "none";

    }


    /* NEW STUDENT */

    else {

        students.push({

            id: Date.now(),

            name: name,

            enrollment: enrollment,

            batch: batch,

            book: book

        });

    }


    /* SAVE */

    saveData();


    /* CLEAR */

    clearForm();


    /* DISPLAY */

    showStudents();


    showMessage(
        "Student details saved successfully!"
    );

}


/* =====================================
   SORT
===================================== */

function sortStudents() {

    students.sort(function(a, b) {

        const aNum =
            parseInt(
                a.enrollment.replace(/\D/g, ""),
                10
            );

        const bNum =
            parseInt(
                b.enrollment.replace(/\D/g, ""),
                10
            );


        if (
            !isNaN(aNum) &&
            !isNaN(bNum)
        ) {

            return aNum - bNum;

        }


        return a.enrollment.localeCompare(
            b.enrollment,
            undefined,
            {
                numeric: true
            }
        );

    });

}


/* =====================================
   DISPLAY
===================================== */

function showStudents() {

    sortStudents();


    const table =
        document.getElementById(
            "studentTable"
        );

    const search =
        document.getElementById(
            "search"
        )
        .value
        .toLowerCase()
        .trim();


    table.innerHTML = "";


    let number = 1;


    students.forEach(function(student) {

        const text =
            (
                student.name +
                " " +
                student.enrollment +
                " " +
                student.batch +
                " " +
                student.book
            ).toLowerCase();


        if (!text.includes(search)) {
            return;
        }


        const row =
            document.createElement("tr");


        row.innerHTML = `

            <td>${number++}</td>

            <td>${escapeHTML(student.name)}</td>

            <td>${escapeHTML(student.enrollment)}</td>

            <td>${student.batch}</td>

            <td>${escapeHTML(student.book)}</td>

            <td>

                <div class="actions">

                    <button
                        class="edit"
                        onclick="editStudent(${student.id})"
                    >
                        Edit
                    </button>

                    <button
                        class="delete"
                        onclick="deleteStudent(${student.id})"
                    >
                        Delete
                    </button>

                </div>

            </td>

        `;


        table.appendChild(row);

    });


    document.getElementById(
        "count"
    ).textContent =
        "Total Students: " +
        students.length;

}


/* =====================================
   EDIT
===================================== */

function editStudent(id) {

    const student =
        students.find(
            s => s.id === id
        );


    if (!student) {
        return;
    }


    editingId = id;


    document.getElementById(
        "name"
    ).value = student.name;


    document.getElementById(
        "enrollment"
    ).value = student.enrollment;


    document.getElementById(
        "book"
    ).value = student.book;


    document
        .querySelectorAll(
            'input[name="batch"]'
        )
        .forEach(function(radio) {

            radio.checked =
                radio.value === student.batch;

        });


    document.getElementById(
        "saveButton"
    ).textContent = "Update Student";


    document.getElementById(
        "cancelButton"
    ).style.display = "inline-block";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =====================================
   DELETE
===================================== */

function deleteStudent(id) {

    const student =
        students.find(
            s => s.id === id
        );


    if (!student) {
        return;
    }


    if (
        confirm(
            "Delete " +
            student.name +
            "'s record?"
        )
    ) {

        students =
            students.filter(
                s => s.id !== id
            );


        saveData();

        showStudents();

        showMessage(
            "Student record deleted."
        );

    }

}


/* =====================================
   CANCEL EDIT
===================================== */

function cancelEdit() {

    editingId = null;

    clearForm();

    document.getElementById(
        "saveButton"
    ).textContent = "Add Student";

    document.getElementById(
        "cancelButton"
    ).style.display = "none";

}


/* =====================================
   CLEAR FORM
===================================== */

function clearForm() {

    document.getElementById(
        "name"
    ).value = "";

    document.getElementById(
        "enrollment"
    ).value = "";

    document.getElementById(
        "book"
    ).value = "";


    document
        .querySelectorAll(
            'input[name="batch"]'
        )
        .forEach(function(radio) {

            radio.checked = false;

        });

}


/* =====================================
   MESSAGE
===================================== */

function showMessage(text) {

    const message =
        document.getElementById(
            "message"
        );

    message.textContent = text;

    message.style.display = "block";


    setTimeout(function() {

        message.style.display = "none";

    }, 2500);

}


/* =====================================
   SECURITY
===================================== */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/* =====================================
   START
===================================== */

showStudents();

</script>
