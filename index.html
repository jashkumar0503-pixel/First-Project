<script>

    /*
     * ==========================================
     * STUDENT BOOK RECORD SYSTEM
     * ==========================================
     */


    // Load existing data from browser
    let students =
        JSON.parse(localStorage.getItem("pceBookStudents")) || [];


    // Variable used while editing
    let editingId = null;


    /*
     * SAVE / ADD STUDENT
     */

    function saveStudent() {

        const name =
            document.getElementById("studentName")
            .value
            .trim();

        const enrollment =
            document.getElementById("enrollment")
            .value
            .trim();

        const book =
            document.getElementById("book")
            .value;

        const batchRadio =
            document.querySelector(
                'input[name="batch"]:checked'
            );

        const batch =
            batchRadio ? batchRadio.value : "";


        // Validation

        if (name === "") {
            alert("Please enter student name.");
            return;
        }

        if (enrollment === "") {
            alert("Please enter enrollment number.");
            return;
        }

        if (batch === "") {
            alert("Please select Batch A or Batch B.");
            return;
        }

        if (book === "") {
            alert("Please select a book.");
            return;
        }


        /*
         * CHECK DUPLICATE ENROLLMENT
         *
         * Enrollment number should identify
         * one student.
         */

        const duplicate =
            students.find(function(student) {

                return (
                    student.enrollment.toLowerCase() ===
                    enrollment.toLowerCase() &&
                    student.id !== editingId
                );

            });


        if (duplicate) {

            alert(
                "This enrollment number already exists."
            );

            return;
        }


        /*
         * EDIT EXISTING STUDENT
         */

        if (editingId !== null) {

            const student =
                students.find(
                    s => s.id === editingId
                );


            if (student) {

                student.name = name;
                student.enrollment = enrollment;
                student.batch = batch;
                student.book = book;

            }

            editingId = null;

            document.getElementById(
                "saveButton"
            ).innerHTML = "➕ Add Student";

            document.getElementById(
                "saveButton"
            ).className = "add-btn";

            document.getElementById(
                "cancelButton"
            ).style.display = "none";

        }


        /*
         * ADD NEW STUDENT
         */

        else {

            const newStudent = {

                id:
                    Date.now().toString() +
                    Math.random()
                    .toString(36)
                    .substring(2),

                name: name,

                enrollment: enrollment,

                batch: batch,

                book: book

            };


            students.push(newStudent);

        }


        // Save data
        saveData();


        // Clear form
        clearForm();


        // Display sorted records
        displayStudents();

    }
